<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;overflow:hidden;background:transparent;font-family:Arial,sans-serif}#board{width:min(100%,620px);aspect-ratio:10/8;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(8,1fr);border:2px solid #111827;border-radius:12px;box-sizing:border-box;overflow:hidden;touch-action:manipulation;user-select:none}.sq{position:relative;min-width:0;display:flex;align-items:center;justify-content:center}.light{background:#707070}.dark{background:#414141}.sq.source{cursor:pointer}.sq.selected{box-shadow:inset 0 0 0 4px #ffbf47}.sq.target:after{content:"";position:absolute;width:22%;aspect-ratio:1;border-radius:50%;background:#ffbf47aa}.sq.capture:after{width:78%;background:transparent;border:4px solid #ffbf47aa;box-sizing:border-box}.piece{position:relative;z-index:2;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 2px 2px #0008);pointer-events:none}.file,.rank{position:absolute;z-index:3;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}.file{right:3px;bottom:2px}.rank{left:3px;top:2px}
</style></head><body><div id="board"></div><script>
function send(type,data){parent.postMessage(Object.assign({isStreamlitMessage:true,type},data),"*")}
const Streamlit={ready(){send("streamlit:componentReady",{apiVersion:1})},height(n){send("streamlit:setFrameHeight",{height:n})},value(v){send("streamlit:setComponentValue",{value:v})}};
const el=document.getElementById("board"),files="abcdefghij";let s={fen:"",orientation:"white",interactive:false,legal:[],selected:"",locked:false};
function parseFen(fen){const out={},ranks=(fen||"").split(" ")[0].split("/");for(let r=0;r<8;r++){let f=0,i=0,row=ranks[r]||"";while(i<row.length){if(/\d/.test(row[i])){let n="";while(i<row.length&&/\d/.test(row[i]))n+=row[i++];f+=Number(n)}else{if(f<10)out[files[f]+(8-r)]=row[i];f++;i++}}}return out}
function squares(){const out=[];if(s.orientation==="black"){for(let r=1;r<=8;r++)for(const f of [...files].reverse())out.push(f+r)}else{for(let r=8;r>=1;r--)for(const f of files)out.push(f+r)}return out}
function sources(){const out={};for(const u of s.legal){if(!u||u.length<4)continue;(out[u.slice(0,2)]??=[]).push({uci:u,dst:u.slice(2,4)})}return out}
function light(c){return((files.indexOf(c[0])+Number(c[1])-1)%2)===1}
function choose(list,dst){const found=(list||[]).filter(x=>x.dst===dst);if(!found.length)return"";if(found.length===1)return found[0].uci;let choice=(prompt("Promotion: Q, R, B, N, T or I","Q")||"Q").toLowerCase();return(found.find(x=>x.uci.endsWith(choice))||found.find(x=>x.uci.endsWith("q"))||found[0]).uci}
function render(){const pieces=parseFen(s.fen),by=sources(),targets=new Set((by[s.selected]||[]).map(x=>x.dst));el.innerHTML="";squares().forEach((coord,idx)=>{const q=document.createElement("div");q.className="sq "+(light(coord)?"light":"dark");if(s.interactive&&!s.locked&&by[coord])q.classList.add("source");if(coord===s.selected)q.classList.add("selected");if(targets.has(coord)){q.classList.add("target");if(pieces[coord])q.classList.add("capture")}const p=pieces[coord];if(p){const img=document.createElement("img");img.className="piece";img.alt=p;img.src="pieces/"+(p===p.toUpperCase()?"w_":"b_")+p.toUpperCase()+".png";q.appendChild(img)}const row=Math.floor(idx/10),col=idx%10;if(row===7){const c=document.createElement("span");c.className="file";c.textContent=coord[0];q.appendChild(c)}if(col===0){const c=document.createElement("span");c.className="rank";c.textContent=coord[1];q.appendChild(c)}q.onclick=()=>click(coord,by);el.appendChild(q)});requestAnimationFrame(()=>Streamlit.height(el.getBoundingClientRect().height+4))}
function click(coord,by){if(!s.interactive||s.locked)return;if(!s.selected){if(by[coord]){s.selected=coord;render()}return}const u=choose(by[s.selected],coord);if(u){s.locked=true;s.selected="";render();Streamlit.value({move:u,nonce:Date.now()+"-"+Math.random()});return}if(by[coord])s.selected=coord;else s.selected="";render()}
addEventListener("message",e=>{if(!e.data||e.data.type!=="streamlit:render")return;const a=e.data.args||{};s.fen=a.fen||"";s.orientation=a.orientation||"white";s.interactive=!!a.interactive;s.legal=a.legal_moves||[];s.locked=false;s.selected="";render()});
new ResizeObserver(render).observe(document.body);Streamlit.ready();render();
</script></body></html>
