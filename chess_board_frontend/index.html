
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stadia Chess Board</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
  }
  #wrap {
    width: 100%;
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
  }
  #board {
    width: 460px;
    height: 460px;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border: 2px solid #111827;
    box-sizing: border-box;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    background: #f0d9b5;
  }
  .sq {
    position: relative;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .light { background: #F0D9B5; }
  .dark  { background: #B58863; }

  .sq.source {
    cursor: pointer;
  }
  .sq.source:hover {
    filter: brightness(1.05);
  }
  .sq.selected {
    box-shadow: inset 0 0 0 4px #7C5CFC;
  }
  .sq.target::after {
    content: "";
    position: absolute;
    width: 22%;
    height: 22%;
    border-radius: 50%;
    background: rgba(52,64,84,.45);
    z-index: 1;
    pointer-events: none;
  }
  .sq.target.capture::after {
    width: 78%;
    height: 78%;
    background: transparent;
    border: 4px solid rgba(52,64,84,.46);
    box-sizing: border-box;
  }

<body>
<div id="wrap"><div id="board" aria-label="Stadia chess board"></div></div>

<script>
/* Minimal Streamlit component API. */
function sendMessageToStreamlitClient(type, data) {
  const outData = Object.assign({
    isStreamlitMessage: true,
    type: type
  }, data);
  window.parent.postMessage(outData, "*");
}

const Streamlit = {
  setComponentReady: function() {
    sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});
  },
  setFrameHeight: function(height) {
    sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: height});
  },
  setComponentValue: function(value) {
    sendMessageToStreamlitClient("streamlit:setComponentValue", {value: value});
  },
  RENDER_EVENT: "streamlit:render",
  events: {
    addEventListener: function(type, callback) {
      window.addEventListener("message", function(event) {
        if (event.data && event.data.type === type) {
          event.detail = event.data;
          callback(event);
        }
      });
    }
  }
};

const boardEl = document.getElementById("board");
let state = {
  fen: "",
  orientation: "white",
  interactive: false,
  legalMoves: [],
  selected: "",
  locked: false,
  size: 460,
  signature: ""
};

function parseFen(fen) {
  const result = {};
  const boardPart = (fen || "").split(" ")[0];
  const ranks = boardPart.split("/");
  for (let r = 0; r < 8; r++) {
    let file = 0;
    for (const ch of (ranks[r] || "")) {
      if (/\d/.test(ch)) {
        file += Number(ch);
      } else {
        if (file < 8) {
          const coord = "abcdefgh"[file] + String(8 - r);
          result[coord] = ch;
        }
        file += 1;
      }
    }
  }
  return result;
}

function displaySquares(orientation) {
  const out = [];
  if (orientation === "black") {
    for (let rank = 1; rank <= 8; rank++) {
      for (const file of "hgfedcba") out.push(file + rank);
    }
  } else {
    for (let rank = 8; rank >= 1; rank--) {
      for (const file of "abcdefgh") out.push(file + rank);
    }
  }
  return out;
}

function mapsFromMoves(moves) {
  const bySource = {};
  for (const uci of (moves || [])) {
    if (!uci || uci.length < 4) continue;
    const src = uci.slice(0,2);
    const dst = uci.slice(2,4);
    if (!bySource[src]) bySource[src] = [];
    bySource[src].push({uci, dst});
  }
  return bySource;
}

function chooseMove(candidates, dst) {
  const found = (candidates || []).filter(x => x.dst === dst);
  if (!found.length) return "";
  const queen = found.find(x => x.uci.length === 5 && x.uci.endsWith("q"));
  return (queen || found[0]).uci;
}

function isLight(coord) {
  const file = coord.charCodeAt(0) - 97;
  const rank = Number(coord[1]) - 1;
  return ((file + rank) % 2) === 1;
}

function renderBoard(force=false) {
  const pieces = parseFen(state.fen);
  const bySource = mapsFromMoves(state.legalMoves);
  const targets = new Set();
  if (state.selected && bySource[state.selected]) {
    for (const m of bySource[state.selected]) targets.add(m.dst);
  }

  const sig = JSON.stringify([
    state.fen, state.orientation, state.interactive,
    state.legalMoves, state.selected, state.locked, state.size
  ]);
  if (!force && sig === state.signature) return;
  state.signature = sig;

  boardEl.style.width = state.size + "px";
  boardEl.style.height = state.size + "px";
  boardEl.innerHTML = "";

  const ordered = displaySquares(state.orientation);
  ordered.forEach((coord, idx) => {
    const sq = document.createElement("div");
    sq.className = "sq " + (isLight(coord) ? "light" : "dark");

    const sourceEnabled = state.interactive && !state.locked && !!bySource[coord];
    if (sourceEnabled) sq.classList.add("source");
    if (coord === state.selected) sq.classList.add("selected");
    if (targets.has(coord)) {
      sq.classList.add("target");
      if (pieces[coord]) sq.classList.add("capture");
    }

    const piece = pieces[coord];
    if (piece) {
      const el = document.createElement("div");
      el.className = "piece p-" + piece;
      sq.appendChild(el);
    }

    const screenRow = Math.floor(idx / 8);
    const screenCol = idx % 8;
    if (screenRow === 7) {
      const f = document.createElement("span");
      f.className = "coord-file";
      f.textContent = coord[0];
      sq.appendChild(f);
    }
    if (screenCol === 0) {
      const rr = document.createElement("span");
      rr.className = "coord-rank";
      rr.textContent = coord[1];
      sq.appendChild(rr);
    }

    sq.addEventListener("click", function(ev) {
      ev.preventDefault();
      ev.stopPropagation();
      handleSquare(coord, bySource);
    });

    boardEl.appendChild(sq);
  });
}

function handleSquare(coord, bySource) {
  if (!state.interactive || state.locked) return;

  if (!state.selected) {
    if (bySource[coord]) {
      state.selected = coord;
      renderBoard(true);
    }
    return;
  }

  if (coord === state.selected) {
    state.selected = "";
    renderBoard(true);
    return;
  }

  if (bySource[coord]) {
    state.selected = coord;
    renderBoard(true);
    return;
  }

  const uci = chooseMove(bySource[state.selected], coord);
  if (!uci) return;

  state.locked = true;
  renderBoard(true);

  Streamlit.setComponentValue({
    move: uci,
    nonce: Date.now()
  });
}

function onRender(event) {
  const args = (event.detail && event.detail.args) || {};
  const newFen = String(args.fen || "");
  const newOrientation = String(args.orientation || "white").toLowerCase();
  const newInteractive = !!args.interactive;
  const newMoves = Array.isArray(args.legal_moves) ? args.legal_moves : [];
  const newSize = Number(args.size || 460);

  if (newFen !== state.fen) {
    state.selected = "";
    state.locked = false;
  }
  if (!newInteractive) {
    state.selected = "";
    state.locked = false;
  }

  state.fen = newFen;
  state.orientation = newOrientation === "black" ? "black" : "white";
  state.interactive = newInteractive;
  state.legalMoves = newMoves;
  state.size = newSize;

  renderBoard(false);

  /* Fixed height: never changes during selection, move, or polling. */
  Streamlit.setFrameHeight(newSize + 4);
}

Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
Streamlit.setComponentReady();
Streamlit.setFrameHeight(464);
</script>
</body>
</html>
